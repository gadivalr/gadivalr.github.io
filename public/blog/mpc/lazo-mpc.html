<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lazo de Control Predictivo basado en Modelo (MPC)</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura · Control Predictivo</p>
    <h1>Lazo de Control Predictivo basado en Modelo (MPC)</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lazo-mpc-title lazo-mpc-desc">
        <title id="lazo-mpc-title">Lazo de Control Predictivo basado en Modelo (MPC)</title>
        <desc id="lazo-mpc-desc">Diagrama del lazo MPC: una referencia entra al controlador MPC, que usa un optimizador y un modelo predictivo con restricciones para calcular la acción de control u aplicada a la planta; la salida medida y retorna por realimentación, y una perturbación afecta a la planta.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Arrows first (behind boxes) -->
        <!-- Referencia -> MPC -->
        <line x1="168" y1="220" x2="256" y2="220" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- MPC -> Planta (u) -->
        <line x1="464" y1="220" x2="560" y2="220" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Planta -> Salida -->
        <line x1="720" y1="220" x2="808" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Perturbación d -> Planta (top entry) -->
        <line x1="640" y1="80" x2="640" y2="188" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- Realimentación y: salida -> abajo -> izquierda -> arriba -> MPC bottom -->
        <path d="M 764,252 V 344 Q 764,352 756,352 H 368 Q 360,352 360,344 V 276" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="184" y="200" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="212" y="209" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REF / SP</text>

        <rect x="492" y="200" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="516" y="209" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">U(K)</text>

        <rect x="744" y="200" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="768" y="209" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">Y(K)</text>

        <rect x="624" y="116" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="125" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">D(K)</text>

        <rect x="536" y="332" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="572" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEDICIÓN</text>

        <!-- Node: Referencia (input/external style) -->
        <rect x="40" y="188" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="188" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="196" width="24" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="60" y="205" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
        <text x="104" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Referencia</text>
        <text x="104" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">setpoint r(k)</text>

        <!-- Node: MPC (focal) -->
        <rect x="256" y="164" width="208" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="164" width="208" height="112" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="264" y="172" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="280" y="181" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CTRL</text>
        <text x="360" y="208" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Controlador MPC</text>
        <text x="360" y="226" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">optimizador + modelo predictivo</text>
        <text x="360" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">restricciones u, y, Δu</text>
        <text x="360" y="260" fill="#5a6580" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">horizonte Np / Nc</text>

        <!-- Node: Planta -->
        <rect x="560" y="188" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="188" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="568" y="196" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="588" y="205" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLANT</text>
        <text x="640" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Planta / Proceso</text>
        <text x="640" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dinámica real</text>

        <!-- Node: Salida (store/state style) -->
        <rect x="808" y="188" width="112" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="808" y="188" width="112" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="816" y="196" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="830" y="205" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
        <text x="864" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Salida</text>
        <text x="864" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">variable y</text>

        <!-- Node: Perturbación (external, dashed) -->
        <rect x="576" y="40" width="128" height="40" rx="6" fill="#f5f5f5"/>
        <rect x="576" y="40" width="128" height="40" rx="6" fill="rgba(79,93,117,0.06)" stroke="#5a6580" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="640" y="64" fill="#4f5d75" font-size="10" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Perturbación d</text>

        <!-- Legend strip -->
        <line x1="40" y1="384" x2="920" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>

        <rect x="40" y="412" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf2269" stroke-width="0"/>
        <rect x="40" y="412" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="420" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Controlador (focal)</text>

        <rect x="180" y="412" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="200" y="420" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Planta</text>

        <rect x="260" y="412" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="280" y="420" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Entrada externa</text>

        <line x1="388" y1="418" x2="416" y2="418" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="424" y="420" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Acción de control</text>

        <line x1="536" y1="418" x2="564" y2="418" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="572" y="420" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Realimentación / salida</text>

        <line x1="724" y1="418" x2="752" y2="418" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="760" y="420" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Perturbación</text>
      </svg>
    </div>
  </div>
</body>
</html>
