<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizonte Recedente en MPC</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Concepto · Control Predictivo</p>
    <h1>Horizonte recedente: predecir, optimizar, aplicar, desplazar</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="horizonte-mpc-title horizonte-mpc-desc">
        <title id="horizonte-mpc-title">Horizonte recedente en MPC</title>
        <desc id="horizonte-mpc-desc">Dos paneles muestran el principio del horizonte recedente: en el instante k el MPC predice la salida sobre un horizonte de predicción y calcula movimientos de control, aplicando solo el primero; en k+1 el horizonte se desplaza, se mide la salida real y se repite la optimización.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Panel labels -->
        <rect x="40" y="32" width="140" height="20" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="110" y="46" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INSTANTE t = k</text>

        <rect x="40" y="288" width="156" height="20" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="118" y="302" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INSTANTE t = k+1</text>

        <!-- ===== Panel k ===== -->
        <!-- axes -->
        <line x1="80" y1="232" x2="900" y2="232" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <line x1="80" y1="232" x2="80" y2="72" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="904" y="236" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">t</text>
        <text x="72" y="68" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">y, r</text>

        <!-- reference r -->
        <line x1="80" y1="120" x2="900" y2="120" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="6,4"/>
        <rect x="828" y="108" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="860" y="117" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">REF r</text>

        <!-- past measured (solid) -->
        <polyline points="80,200 140,192 200,176 260,160 320,148" fill="none" stroke="#2d3142" stroke-width="1.6"/>
        <circle cx="320" cy="148" r="3.5" fill="#bf4520"/>

        <!-- prediction horizon bracket Np -->
        <line x1="320" y1="244" x2="320" y2="252" stroke="#bf4520" stroke-width="1"/>
        <line x1="320" y1="248" x2="720" y2="248" stroke="#bf4520" stroke-width="1"/>
        <line x1="720" y1="244" x2="720" y2="252" stroke="#bf4520" stroke-width="1"/>
        <rect x="488" y="240" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="249" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Np</text>

        <!-- predicted output (accent dashed) -->
        <polyline points="320,148 380,136 440,128 500,124 560,122 620,121 680,120 720,120" fill="none" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5,4"/>

        <!-- control horizon Nc (moves) -->
        <rect x="320" y="188" width="20" height="44" rx="0" fill="rgba(191,69,32,0.18)" stroke="none"/>
        <rect x="340" y="196" width="20" height="36" rx="0" fill="rgba(191,69,32,0.12)" stroke="none"/>
        <rect x="360" y="200" width="20" height="32" rx="0" fill="rgba(191,69,32,0.10)" stroke="none"/>
        <rect x="380" y="202" width="80" height="30" rx="0" fill="rgba(191,69,32,0.07)" stroke="none"/>
        <line x1="320" y1="232" x2="320" y2="184" stroke="rgba(191,69,32,0.35)" stroke-width="0.8"/>
        <line x1="460" y1="232" x2="460" y2="198" stroke="rgba(191,69,32,0.35)" stroke-width="0.8"/>
        <line x1="320" y1="258" x2="320" y2="266" stroke="#4f5d75" stroke-width="0.8"/>
        <line x1="460" y1="258" x2="460" y2="266" stroke="#4f5d75" stroke-width="0.8"/>
        <line x1="320" y1="262" x2="460" y2="262" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="372" y="254" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="390" y="263" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Nc</text>

        <!-- apply only first move -->
        <path d="M 330,176 Q 330,156 348,156 H 392" fill="none" stroke="#bf4520" stroke-width="1" marker-end="url(#arrow-accent)"/>
        <rect x="352" y="144" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="408" y="153" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SOLO u(k)</text>

        <text x="320" y="276" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">k</text>

        <!-- ===== Panel k+1 ===== -->
        <line x1="80" y1="488" x2="900" y2="488" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <line x1="80" y1="488" x2="80" y2="328" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="904" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">t</text>
        <text x="72" y="324" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">y, r</text>

        <line x1="80" y1="376" x2="900" y2="376" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="6,4"/>
        <rect x="828" y="364" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="860" y="373" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">REF r</text>

        <!-- past measured including k+1 -->
        <polyline points="80,456 140,448 200,432 260,416 320,404 360,396" fill="none" stroke="#2d3142" stroke-width="1.6"/>
        <circle cx="360" cy="396" r="3.5" fill="#bf4520"/>
        <circle cx="320" cy="404" r="2.5" fill="rgba(45,49,66,0.35)"/>

        <!-- shifted horizon Np -->
        <line x1="360" y1="500" x2="360" y2="508" stroke="#bf4520" stroke-width="1"/>
        <line x1="360" y1="504" x2="760" y2="504" stroke="#bf4520" stroke-width="1"/>
        <line x1="760" y1="500" x2="760" y2="508" stroke="#bf4520" stroke-width="1"/>
        <rect x="520" y="496" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="560" y="505" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Np (despl.)</text>

        <!-- new prediction -->
        <polyline points="360,396 420,388 480,382 540,379 600,378 660,377 720,376 760,376" fill="none" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5,4"/>

        <!-- shift arrow annotation -->
        <line x1="320" y1="520" x2="360" y2="520" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="324" y="524" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="352" y="533" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">+1 paso</text>

        <!-- new first move highlight -->
        <rect x="360" y="444" width="20" height="44" rx="0" fill="rgba(191,69,32,0.18)" stroke="none"/>
        <path d="M 370,432 Q 370,414 388,414 H 432" fill="none" stroke="#bf4520" stroke-width="1" marker-end="url(#arrow-accent)"/>
        <rect x="392" y="402" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="452" y="411" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SOLO u(k+1)</text>

        <text x="360" y="532" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">k+1</text>
        <text x="320" y="532" fill="rgba(45,49,66,0.45)" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">k</text>

        <!-- Legend strip -->
        <line x1="40" y1="544" x2="920" y2="544" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" opacity="0"/>

      </svg>
    </div>
  </div>
</body>
</html>
